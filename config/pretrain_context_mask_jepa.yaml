data:
  data_dir: data
  datasets: mixed       # matr | nasa | mixed
  seq_len: 320
  max_gap: 10
  val_fraction: 0.15
  test_fraction: 0.15
  batch_size: 64
  num_workers: 4
  stride: 80
  processed_dir_name: processed  # processed | half_processed

model:
  seq_len: ${data.seq_len}
  patch_size: 32
  strides: 32
  num_channels: 3
  embed_dim: 128
  enc_nhead: 4
  enc_layers: 2
  pred_nhead: 4
  pred_layers: 1
  sigreg_lambda: 0.1
  sigreg_knots: 17
  sigreg_num_proj: 1024
  lr: 3e-4
  weight_decay: 1e-3
  warmup_epochs: 10
  future_context_mask_ratio: 0.7

trainer:
  max_epochs: 1000
  accelerator: auto
  devices: auto
  patience: 100
  seed: 42


CONTEXT_MASK_JEPA_CKPT=$(find logs/pretrain -path '*/context_mask_jepa/version_*/checkpoints/best-context-mask-jepa.ckpt' -type f -printf '%T@ %p\n' | sort -nr | awk 'NR==1{print $2}')

CONTEXT_MASK_PROJECTION_JEPA_CKPT=$(find logs/pretrain -path '*/context_mask_projection_jepa/version_*/checkpoints/best-context-mask-projection-jepa.ckpt' -type f -printf '%T@ %p\n' | sort -nr | awk 'NR==1{print $2}')

uv run python src/scripts/experiments/forecast.py \
  checkpoint=dummy projection_jepa_checkpoint=dummy hybrid_jepa_checkpoint=dummy \
  hybrid_context_mask_jepa_checkpoint="$CONTEXT_MASK_JEPA_CKPT" \
  context_mask_projection_jepa_checkpoint="$CONTEXT_MASK_PROJECTION_JEPA_CKPT" \
  hybrid_projection_jepa_checkpoint=dummy ts_jepa_checkpoint=dummy ts_jepa_sigreg_checkpoint=dummy mae_checkpoint=dummy \
  data.datasets=nasa \
  experiments.pretrained_frozen=false experiments.random_frozen=false experiments.random_supervised=false experiments.pretrained_finetune=false \
  experiments.pretrained_projection_jepa_frozen=false experiments.pretrained_hybrid_jepa_frozen=false \
  experiments.pretrained_hybrid_context_mask_jepa_frozen=true experiments.pretrained_context_mask_projection_jepa_frozen=true \
  experiments.pretrained_hybrid_projection_jepa_frozen=false experiments.pretrained_ts_jepa_frozen=false experiments.pretrained_ts_jepa_sigreg_frozen=false experiments.pretrained_mae_frozen=false

  uv run python src/scripts/experiments/current_soh.py \
  checkpoint=dummy projection_jepa_checkpoint=dummy hybrid_jepa_checkpoint=dummy \
  hybrid_context_mask_jepa_checkpoint="$CONTEXT_MASK_JEPA_CKPT" \
  context_mask_projection_jepa_checkpoint="$CONTEXT_MASK_PROJECTION_JEPA_CKPT" \
  hybrid_projection_jepa_checkpoint=dummy ts_jepa_checkpoint=dummy ts_jepa_sigreg_checkpoint=dummy mae_checkpoint=dummy \
  +data.datasets=nasa \
  experiments.pretrained_frozen=false experiments.pretrained_frozen_attention=false experiments.random_frozen=false experiments.random_frozen_attention=false \
  experiments.random_supervised=false experiments.pretrained_finetune=false experiments.pretrained_projection_jepa_frozen=false \
  experiments.pretrained_hybrid_jepa_frozen=false experiments.pretrained_hybrid_context_mask_jepa_frozen=true \
  experiments.pretrained_context_mask_projection_jepa_frozen=true experiments.pretrained_hybrid_projection_jepa_frozen=false \
  experiments.pretrained_ts_jepa_frozen=false experiments.pretrained_ts_jepa_sigreg_frozen=false experiments.pretrained_mae_frozen=false

  uv run python src/scripts/experiments/forecast_soh.py \
  checkpoint=dummy projection_jepa_checkpoint=dummy hybrid_jepa_checkpoint=dummy \
  hybrid_context_mask_jepa_checkpoint="$CONTEXT_MASK_JEPA_CKPT" \
  context_mask_projection_jepa_checkpoint="$CONTEXT_MASK_PROJECTION_JEPA_CKPT" \
  hybrid_projection_jepa_checkpoint=dummy ts_jepa_checkpoint=dummy ts_jepa_sigreg_checkpoint=dummy mae_checkpoint=dummy \
  +data.datasets=nasa \
  experiments.pretrained_frozen=false experiments.pretrained_frozen_attention=false experiments.random_frozen=false experiments.random_frozen_attention=false \
  experiments.random_supervised=false experiments.pretrained_finetune=false experiments.pretrained_projection_jepa_frozen=false \
  experiments.pretrained_hybrid_jepa_frozen=false experiments.pretrained_hybrid_context_mask_jepa_frozen=true \
  experiments.pretrained_context_mask_projection_jepa_frozen=true experiments.pretrained_hybrid_projection_jepa_frozen=false \
  experiments.pretrained_ts_jepa_frozen=false experiments.pretrained_ts_jepa_sigreg_frozen=false experiments.pretrained_mae_frozen=false